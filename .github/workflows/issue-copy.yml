# Emails whoever opens an issue a copy of it
# (suggested in joshknnd1982/outlookFirstLineSilence#6).
# GitHub never emails you the issue you file yourself, so until someone
# comments there is no email to reply to, and a later thought became a new
# issue. The author is subscribed to their issue, so this comment reaches them
# by email, and a reply to that email is added to the issue as a comment.
name: Email the reporter a copy of their issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  copy:
    # The owner doesn't need a copy, and bots can't reply.
    if: github.event.issue.user.login != github.repository_owner && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment with a copy of the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        # The issue text comes in through the environment, never pasted into
        # the script, so nothing in it can run as a command.
        run: |
          # $(...) also drops the newlines at the end.
          report="$(printf '%s' "$BODY" | tr -d '\r')"
          {
            printf '%s\n\n' "Thank you for the report. This is a copy of it, so you have it in your email."
            printf '%s\n\n' "If you think of anything else, reply to this email and GitHub adds your reply to this issue. Files attached to an email reply are dropped, so to attach a log, use the link at the bottom of this email to open the issue and add a comment there."
            if [ -n "$report" ]; then
              printf '%s\n' "Your report:" ""
              printf '%s\n' "$report" | sed 's/^/> /'
            fi
          } > comment.md
          gh issue comment "$NUMBER" --repo "$REPO" --body-file comment.md
