name = jawsMigrator
summary = "JAWS Migration Assistant"
description = """Brings a JAWS user's settings into NVDA: Settings Center options, voice profiles and voice aliases, speech and sound schemes, dictionaries, punctuation, keystrokes for each keyboard layout, and JAWS sounds, mapped strictly to their NVDA equivalents, so NVDA announces what JAWS announced. You choose exactly what comes over. With ClassicSpeech, which it can install for you, JAWS sounds can play in place of NVDA's own. Always installs the newest versions of the add-ons it uses. Adapts to each computer's JAWS versions, languages, synthesizers and add-ons, backs up NVDA's settings, add-ons and add-on settings first, and never changes JAWS."""
author = "Josh Kennedy (https://github.com/joshknnd1982)"
url = https://github.com/joshknnd1982/jawsMigrator
version = 1.35
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
changelog = """Version 1.35

* The Emoticons add-on is left alone from its version 38.2.0, which writes no warnings. Since 1.34, the assistant has Emoticons 38.0.0 read NVDA's speech dictionaries once for each change instead of twice for each emoticon, so NVDA writes its warning once instead of 177 times at each profile switch. To do that, the assistant read them once itself. Emoticons 38.2.0, for NVDA 2026.3, keeps NVDA's temporary dictionary itself and no longer reads the name NVDA warns about, so NVDA writes no warning, but the assistant's own reading would have added one at each change. Now the assistant helps only a version of Emoticons that still reads that name, such as 38.0.0 on NVDA 2026.2 or 2026.3, and Columns Review as before.
* Tested with NVDA 2026.3's own getDictionaryDefinition and Emoticons 38.2.0's own code: with 1.34, eight profile switches wrote 16 warnings; now none, and NVDA's temporary dictionary holds the same.

Version 1.34

* Regions, groups, lists and articles on web pages are said with JAWS's words. The tester asked whether NVDA should match JAWS, and for JAWS to be tested so nothing is missed, so JAWS 2026 was run in Edge on copies of the tester's reddit and GitHub pages. As the focus moves, JAWS says "main region", "banner region", "Global navigation region", "Reply form region" and "new Comment group", where NVDA said "main landmark", "banner landmark", "Global navigation landmark", "Reply form landmark" and "new Comment grouping". With the arrow keys, JAWS names only the main and navigation regions, with their names, and says where they end ("Reddit navigation region" ... "Reddit navigation region end"); it says "list of 2 items" ... "list end", "Community actions region" ... "Community actions region end", "Comment by visible_help article" ... "article end", and "group start new Comment" ... "group end new Comment". NVDA said every landmark, "banner" and "search" too, never where one ends, "list with 2 items" ... "out of list", and "out of region", "out of article" and "out of grouping". Now NVDA says these with JAWS's words in Edge, Chrome and Firefox. Say All names every region, as JAWS did reading a page from the top. What NVDA's Document Formatting settings leave out stays out, a role a page gives its own words to is said as NVDA says it, and braille is unchanged. To have NVDA say them as before, uncheck "Say regions, groups and lists on web pages with JAWS's words" in NVDA's Settings, JAWS Migration Assistant.
* The first time you come to a page, NVDA says its title without the page's first line. Switching with Alt+Tab to a reddit window NVDA hadn't read yet, NVDA said the window, the post's title and "same page link Skip to main content". JAWS said the window and the title. Coming back to a page, JAWS says the line its cursor is on, as NVDA does, but JAWS's cursor starts on the page's title, and NVDA's on the page's first line. Now, the first time NVDA comes into an Edge or Chrome page, with the page itself focused and the caret on its first line, it says the title and not that line. A caret further down the page, coming back to a page, focus mode and "Automatic Say All on page load" are as before. This is part of "Say Edge and Chrome windows and pages as JAWS does".
* Tested live with JAWS 2026 on Edge 154, with its speech history copied after each key, repeating the tester's Alt+Tab trip and reading the copies with the arrow keys, Tab and Control+Tab, and with NVDA 2026.2's own speech code in the unit tests. With the changes, NVDA says JAWS's words for every region, group, list and article JAWS named.
* Alt+Tab into and out of Edge no longer holds NVDA up, and Insert+F7 opens the Links List again. In the tester's log, each Alt+Tab into or out of Edge froze NVDA twice, about two seconds each time, and three times Insert+F7 opened Edge's "Turn on caret browsing?" instead of the Links List. Going into or out of Edge, NVDA switches configuration profiles twice: the migration's "JAWS - msedge" profile, and Custom Browse Mode's "browseMode" profile as browse mode turns on or off. At each switch, the Columns Review add-on asked NVDA for every command of every add-on to learn the keys of three of NVDA's own (0.75 to 0.87 seconds), and the Emoticons add-on wrote 177 warnings with their stacks to NVDA's log (0.2 seconds). When NVDA is stuck for half a second after the foreground window changes, it lets keys go straight to the program, so Edge got F7. Now Columns Review asks NVDA again only when NVDA's keys change, and Emoticons reads NVDA's dictionaries once for each change, so NVDA writes its warning once, not 177 times. What the two add-ons do is unchanged. JAWS switches a program's settings at once. To have them work as before, uncheck "Keep Columns Review and Emoticons from holding NVDA up each time you switch programs or browse mode turns on or off" in NVDA's Settings, JAWS Migration Assistant.
* Tested with NVDA 2026.2's own gesture maps, its list of all commands and its speech dictionary code, and Columns Review 5.7.0's and Emoticons 38.0.0's own code. Before the change, an Alt+Tab out of Edge and back had Columns Review ask NVDA for every command 8 times and Emoticons write 708 warnings. Now Columns Review asks once, until NVDA's keys change, and Emoticons writes 2 warnings a switch. The keys Columns Review binds and Emoticons' dictionary are the same as before.

Version 1.33

* Coming back to Edge or Chrome, a page is said by its title without "document", also when the focus is in a field on it. After updating to 1.31, the tester switched with Alt+Tab to Edge, where a GitHub page had the focus in its comment box, and NVDA still said the page's title and "document". 1.31 left "document" out only when the page itself gets the focus, as when it opens; here NVDA said the page as a place the focus is in, before the comment box. JAWS said the title alone. Now NVDA says it by its title either way. A frame's own page, inside a page, is said as before.
* Choosing another tab, NVDA no longer says the page of the tab you are leaving. The tester chose their reddit tab in Alt+Tab. Edge first put the focus back in the GitHub comment box, where it had been, then moved it to the reddit page, so NVDA said the GitHub page's title, "main landmark" and "new Comment grouping" before the reddit page. JAWS said only the reddit page. NVDA drops what it hasn't said yet about the focus once the focus moves on, but not what it says about the places the focus is in. Now, in Edge and Chrome, what NVDA hasn't said yet about a page, landmark, group or other place is dropped too once the focus has left it. A place the focus is still in is said as before, and NVDA doesn't cut short what it has started saying.
* A page's title or a window's name isn't said twice at once. On the reddit page NVDA said the title twice in a row; now once, and again whenever you come back.
* The speech history (NVDA+Shift+J, then H) leaves out what NVDA dropped before saying any of it. JAWS's speech history holds what went to the synthesizer. The history the tester pasted had the GitHub part twice, but NVDA had dropped most of the first, and the second one's comment box, before saying them. Now the history leaves out what NVDA's speech manager dropped without saying a word of it: what it had for a focus that moved on, and what it hadn't started when it cut speech short. What you paste is what you heard.
* Tested with NVDA 2026.2's own speech manager and focus code, and the tester's pages and settings. Before the change, NVDA was asked to say the lines of the tester's log word for word. After it, the synthesizer said the window, the reddit page's title and its first line, and the speech history held just those.
* All of this is part of "Say Edge and Chrome windows and pages as JAWS does" and of keeping the speech history, in NVDA's Settings, JAWS Migration Assistant; unchecking them gives NVDA's own back.

Version 1.32

* Insert+Control+V says the program's version where an add-on that is turned off had the key. After updating to 1.30, a tester wrote that Insert+Control+V still opened NVDA's speech settings. Their log showed why: their NVDA input gestures give Insert+Control+V to the add-on Say Product Name and Version, which is turned off. NVDA passes over a key given to an add-on that is off, so the key opened NVDA's speech settings, but 1.30 took it for a key the tester had chosen for something else, and added only Control+Insert+Windows+V. Now a key given to an add-on that is off or removed doesn't count as taken, in a migration or when keys are added after an update. While that add-on was on, the key didn't run NVDA's own command, so the JAWS command takes it even if you kept NVDA's keys. Where 1.30 or 1.31 left a key out this way, the assistant adds it once, a little after NVDA starts, after backing up NVDA's settings, and NVDA says which key now works. Keys added before, and keys you have changed since, stay as they are. The add-on's own line in gestures.ini is left alone; if you turn that add-on on again, NVDA runs whichever of the two commands it asks first.

Version 1.31

* Edge and Chrome windows and pages are said as JAWS says them, by their titles. A tester opened a reddit post in Edge and NVDA said the window's name and "window", then "the post's title - Microsoft Edge, region", then the post's title, "document" and the page's whole address. On a copy of the page, JAWS 2026 said the titles alone, never "window", "document" or the address. NVDA said the address and "region" because it read Edge through UI Automation that time, where a page's value is its address and Edge's own frame around the page is a region; through IAccessible2, the way NVDA normally reads Edge's pages and JAWS reads them, NVDA says neither. Now NVDA says Edge's and Chrome's window by its name, without "window", and a page, when it opens or you come back to it, by its title, without "document" or its address, and it doesn't say Edge's frame. Anything else NVDA says with them stays. NVDA+Tab, a page without a title, other programs and braille are as before. To have NVDA say them as before, uncheck "Say Edge and Chrome windows and pages as JAWS does" in NVDA's Settings, JAWS Migration Assistant.
* E says an edit field as JAWS does: without the landmarks around it, and "blank, placeholder" when it is empty. On the same post, E said "banner landmark, navigation landmark, search landmark, Remove r/Visible filter and expand search to all of Reddit, edit, Search in r/Visible" and "main landmark, edit, Join the conversation". JAWS's E says no landmark, and for an empty field says "blank", then "placeholder" and its placeholder: "Remove r/Visible filter and expand search to all of Reddit, edit, blank, placeholder, Search in r/Visible" on a copy of the page, and "edit, blank, placeholder, Join the conversation" on reddit. Now E and Shift+E, and Move to in the Elements List, say an edit field without the landmarks, regions and lists around it, as H has said a heading since 1.13, and an empty one with "blank", then "placeholder" and its placeholder. A field with text in it is said as before, and the arrow keys, Tab and other quick navigation keys still say the landmarks they come into. It is part of the check box for headings, now "When quick navigation moves to a heading or an edit field, don't say the landmark, region or list it is in, and say "blank, placeholder" for an empty edit field".
* Tested with both NVDA and JAWS, as the tester asked: on a copy of the post's page built the way Reddit's scripts build it, in Edge 154, JAWS 2026 driven through its programming interface with its speech history copied after each step, and NVDA 2026.2 without and with these changes. With them, NVDA said for E exactly what JAWS said.

Version 1.30

* Insert+Control+V says the name and version of the program you are in, and pressed twice shows the version details, as in JAWS. The tester wrote: "It should work like Jaws. insert control V says the product version. Pressing it twice brings up the following. You can arrow and copy any or all of what you need." NVDA has no such command; its own NVDA+Control+V opens its speech settings. Now, once, NVDA says what JAWS says, from the version information in the program's file, or a Store app's package: "Microsoft Edge Version 154.0.4258.37". As JAWS's scripts do, File Explorer and the desktop give the version of Windows, and Word, Outlook, PowerPoint and Access say how Office was bought: "Microsoft Outlook Subscription Version 16.0.20326.20158". Twice, NVDA opens a Version Details window that you read with the arrow keys, select with Shift and copy with Control+C, or copy all with its Copy button. It has JAWS's lines with NVDA's facts: the program's version, NVDA's version, the assistant's version, the NVDA configuration profile in use, the program's executable, NVDA's support for the program, ClassicSpeech's speech and sounds scheme, and the version of Windows as JAWS words it. Control+Insert+Windows+V copies the version details without opening anything, and NVDA says "Version Details Copied To Clipboard". NVDA+Shift+J, then V, Shift+V and Control+V do the same. A migration gives JAWS's keys to these commands; Insert+Control+V, NVDA's key for its speech settings, only when you let JAWS's keys take NVDA's. If you migrated your keystrokes before, the assistant adds these keys once, a little after NVDA starts, as your migration added its own, after backing up NVDA's settings; a key you gave a command of your own stays yours.

Version 1.29

* In Outlook, Insert+Page Down (NVDA's "Report status bar") reads the status bar as JAWS does. In Outlook's Inbox, a tester heard JAWS say "Items in View 2,675", "Unread Items in View 1,135" and "Zoom 10%", and NVDA say "Status Bar", those, and every other control in the status bar too: the view buttons with their tooltips, and the zoom slider and its buttons with the zoom. JAWS's script for Outlook reads only the status bar's items, the kind of control Office calls a simple button, a line each. Now NVDA reads those in Outlook, with a short pause between them: "Items in View 2,675, Unread Items in View 1,135, Zoom 10%". Twice spells it and three times copies it, as before. Other programs are as before. To have NVDA read it as before, uncheck "Read Outlook's status bar as JAWS does" in NVDA's Settings, JAWS Migration Assistant.
* Each of JAWS's list keys opens a list of its own kind, as in JAWS. The tester pointed out that JAWS's Insert+F7 lists only the links, where NVDA's Elements List has radio buttons for links, headings, form fields, buttons and landmarks. JAWS has a list for each kind, each with its own key. The migration gives those keys to NVDA's Elements List, which opened on links, or on the kind last chosen there, whichever key was pressed. Now Insert+F7 opens the Elements List on links alone, with no radio buttons, and NVDA says "Links List" as JAWS does. Insert+F6 opens the headings ("Heading List"). Where the migration was allowed to take NVDA's own keys for them, Insert+F5 opens the form fields, Control+Insert+B the buttons and Control+Insert+R the regions (NVDA's landmarks). The Filter box, Move to and Activate work as before. On a page with none of that kind, NVDA says what JAWS says, such as "No headings found", and opens nothing. Any other key you give the Elements List in Input Gestures opens NVDA's own list with every kind. To have NVDA's own list for every key, uncheck "Open a list of one kind for each JAWS list key" in NVDA's Settings, JAWS Migration Assistant.
* NVDA+Shift+J, then H shows what NVDA said, as JAWS's Insert+Space, H does, and Control+H copies it. The tester found the Speech History add-on a pain to use, and it is how they tell us what NVDA said: Shift+F11 and Shift+F12 go back and forth one thing at a time, and F12 copies the one thing it is on. JAWS keeps the last 500 things it said: Insert+Space, H opens them in a window, the most recent last, on the most recent line; Insert+Space, Control+H copies them all; Insert+Space, Shift+H clears them. Now the assistant keeps the last 500 things NVDA said, one line for each time NVDA spoke, and NVDA+Shift+J, then H, Control+H and Shift+H do what JAWS's keys do. In the Speech History window, Up Arrow goes back, Control+C copies what you select, Copy all copies everything, and Escape closes it. It holds what you heard, after ClassicSpeech's changes, in memory only. The layer's help moves from H to question mark or F1, JAWS's keys for it. A migration takes JAWS's own speech history option. To stop keeping it, uncheck "Keep what NVDA says, for NVDA+Shift+J then H, as JAWS's speech history" in NVDA's Settings, JAWS Migration Assistant.

Version 1.28

* NVDA says what you type in Edge after it starts on the taskbar and goes back to your window. A tester started NVDA with Control+Alt+N while writing a message in Reddit's chat in Edge; NVDA went back to Edge, as it has since 1.18, then said nothing typed in the message box but a capital I. NVDA reads Edge's web pages through IAccessible2, but it can tell whether it reads a program through UI Automation only once its helper is in that program, which it takes in only after all its add-ons have started. Edge came back to the front while they started, so NVDA took the message box through UI Automation, and a few keys later had the page itself as the focus. NVDA says typed characters "only in edit controls" as set, and a page isn't one. It happened at four of the five starts in the tester's logs that went back to Edge. Now, while NVDA starts, it leaves out the UI Automation focus event of the program you go back to, finds the focus itself once it has started, as for a window that was in front when it started, and asks again how it reads that window. On another computer, NVDA took Edge's message box through UI Automation at each of four starts with 1.27, and through IAccessible2 at each of four starts with 1.28. Programs NVDA reads through UI Automation, such as Notepad, are as before. There is nothing to set.

Version 1.27

* A migration takes JAWS's Outlook option "Messages Automatically Read" into the check box 'Read an Outlook message from the top when it opens, as JAWS's "Messages automatically read" does'. A tester found the option in Outlook's Quick Settings (Insert+V), Reading Options: not checked, which is why their JAWS says nothing when they open a message. JAWS keeps it in its settings for Outlook, and JAWS 2026 has it checked as it comes, so a JAWS user who never changed it hears each message read from the top as it opens. Now the migration sets the check box to what JAWS does, your own Outlook settings first, then JAWS's: off for the tester, on for a JAWS as it comes. It is listed with the Settings Center options, where you can leave it out, and the report names the JAWS file it came from. With "your settings only", it comes over only if you changed it in JAWS. The check box stays as it is until you migrate again. A test also checks that the settings 1.25 left behind don't turn reading on open back on.

Version 1.26

* An empty edit field on a web page is said as JAWS says it. A tester pressed E to the reply box of a reddit post in Edge, then Enter: JAWS said "edit, blank, placeholder, Join the conversation"; NVDA said "main landmark", then "Join the conversation, edit, multi line, blank". The box has no label, only its grey placeholder text, so Edge makes that text its name, and NVDA said it first, as a name. JAWS's scripts for Edge, Chrome and Firefox say an empty edit field as its name and "edit", its states, "blank", then "placeholder" and the placeholder, then its description, and a name made from the placeholder isn't a name to them. Now NVDA says an empty edit field on a web page that way when the focus moves to it and for NVDA+Tab: GitHub's title box is "Add a title, edit, required, blank, placeholder, Title". A field with text in it is said without its placeholder, as before. NVDA no longer says "multi line" for an edit field, as JAWS doesn't with its "Announce multi-line edit" off, as JAWS comes; braille still shows it. And NVDA no longer says "main landmark" again when Enter puts the focus in a field browse mode's cursor was already on: NVDA said it when E got there, and JAWS's cursor takes the focus with it. Tab to a field in another landmark still says that landmark. Setting: 'Say edit fields on web pages as JAWS does: "blank, placeholder" and the placeholder, no "multi line", and no landmark you were already in'.
* An Outlook message is no longer read from the top when you open it. A tester's JAWS says nothing when they press Enter on a message and reads it only with the arrow keys; what the tester pasted for 1.25 was JAWS reading line by line, not its Say All. Reading a message as it opens now has a check box of its own, off unless you check it: 'Read an Outlook message from the top when it opens, as JAWS's "Messages automatically read" does'. The other check box is now 'Say Outlook messages as JAWS does: "send mail link" for an e-mail address, where lists start and end, and no heading for the From line of a quoted message', on as before.
* NVDA says where a list starts and ends in an Outlook message you read: "list with 3 items" and "out of list", as it says lists on web pages. Arrowing through a message, the tester's JAWS said "list of 3 items" and "list end"; NVDA said only the bullets, as NVDA leaves lists out of Word documents.

Version 1.25

* An Outlook message is read from the top when you open it, as JAWS reads it. A tester opened the same message with JAWS and with NVDA: JAWS read it straight through, "From: Send Mail Link nvda-addons@nvda-addons.groups.io < Send Mail Link nvda-addons@nvda-addons.groups.io> On Behalf Of..." and on; NVDA said nothing, then "heading level 1, From:" and "link" with the arrow keys. JAWS's Outlook settings read a message you open from the top ("Messages automatically read"). NVDA does that only with "Automatic Say All on page load", one setting for web pages and messages alike, which the migration takes from JAWS's setting for web pages, off as JAWS comes; so NVDA said only the first line, and the Outlook First Line Silence add-on keeps even that quiet. Now NVDA reads an Outlook message you open from the top, as NVDA+Down Arrow does. Web pages, a message you come back to and messages you write are as before. A link to an e-mail address is "send mail link", as JAWS says it, while NVDA's "Link type" is checked; braille is as before. And the From line of a message a reply or forward quotes is no longer "heading level 1": Outlook gives it an outline level so it can collapse what follows, and Word calls that a heading; JAWS says a heading only for text in a heading style, and now NVDA does too in Outlook. Setting: "Read an Outlook message from the top when it opens, as JAWS does...".
* NVDA says a heading that is a link on a web page as JAWS does. A tester pressed H on profootballrumors.com: JAWS said "HEADLINES, heading level 3, Link", where NVDA said "HEADLINES, same page, link, Homepage, heading, level 3". NVDA called a link to the page you are on "same page"; JAWS says it only for a link to a place on the page, such as "Skip to content", and now NVDA says "same page" only when the link's address has a "#". "Homepage" was the link's title, which Edge gives NVDA as its description; JAWS says a link's text, not its title, and now NVDA leaves a link's title out in Edge and Chrome (descriptions a page writes for screen readers are still said). And when H, Shift+H, 1 to 9 or the Elements List moves to a heading that is a link, NVDA now says the text, "visited" if you have been there, the heading and its level, then "link". Tab, K and the arrow keys say links as before. Setting: Say links on web pages as JAWS does: "same page" only for a link to a place on the page, no link titles, and "link" after a heading.
* Migrating JAWS settings: NVDA's "Report link type", whose only type is "same page", now comes from JAWS's "Identify same page links". It came from "Identify link type", which is about mail and FTP links, which NVDA doesn't name on web pages.

Version 1.24

* NVDA no longer says "page 1, section 1" in an Outlook message. A tester writing a message in Outlook pressed Control+Home and heard "page 1, section 1" before the first line, and the same came at the first line NVDA read in other messages. JAWS says no page or section in Outlook. Outlook's messages are Word documents, and NVDA says page and section numbers in Word, as "Page numbers" is checked in its Document Formatting settings when NVDA comes. NVDA's own Outlook support leaves them out, but only when NVDA reads Word through Word's object model; with a recent Office NVDA reads Word through UI Automation, and there it didn't. Now NVDA leaves page, section and column numbers out of Outlook messages. The rest of the formatting, and page numbers in Word itself, are as before. Setting: "Don't say page and section numbers in Outlook messages".
* NVDA no longer says "List top" when File Explorer opens a folder. A tester heard "Items View list, List top:" each time a folder opened, and "List top" on the desktop and after Home, where JAWS says the first file alone. The words aren't NVDA's: they come from the Columns Review add-on, whose "Announce list bounds" is on as it comes and says "List top" at a list's first item, "List bottom" at its last and "Mono-item list" in a list of one. JAWS has messages for the ends of a list, but none of its scripts uses them. Now Columns Review says nothing at the ends of a list, in File Explorer, on the desktop and in other lists. If Columns Review is set to beep there, it still beeps, and everything else it does is as before. Setting: Keep Columns Review from saying "List top" and "List bottom" at the ends of a list.

Version 1.23

* Typing in a large document loses fewer letters. A tester typing a note at the top of a saved NVDA log, 21 million characters in Windows 11's Notepad, lost letters and spaces, some came out of order, and NVDA said little of what they typed. Typed into a copy of that log, a key every 150 ms, with NVDA 2026.2 and no other add-ons, the same sentence lost 5 to 23 of its 59 characters each time. Most of that is Notepad's own: in a file that size it takes a fifth to a third of a second to type each character, slower than the keys come, and with NVDA quit it still lost letters in two tries of three. NVDA made it worse. It listens for changes to the value of the document you are in, and the value of Notepad's document is its whole text: Notepad built all 42 MB of it at every key, a tenth of a second more for each character, and the build failed every time. NVDA doesn't use that for a document anyway; it follows the caret and the text. Now NVDA doesn't listen for the value of a document or a text field of more than one line, and everything else, such as the caret moving, comes as before. Notepad is still slow with a file that size and can still lose a letter, so type notes in a new document or in GitHub's comment box, and attach NVDA's log with NVDA+Shift+J, then L. Setting: "Keep NVDA from having a document build its whole text at every key, which slows typing in a large file".
* Fixed: when NVDA logs at its debug level, the L of NVDA+Shift+J, then L was noted as a key the program never typed. A key NVDA runs a command for never reaches the program, and is no longer waited for.

Version 1.22

* In an edit field on a web page, the arrow keys stay in the field at its start and end, as in JAWS. A tester pressed Control+Right Arrow at the end of a comment on GitHub, and NVDA said "out of edit, button" and was in browse mode on the button after the comment box. Right Arrow and Down Arrow did the same. JAWS's Auto Forms Mode is on in the tester's JAWS, so the migration turned on NVDA's nearest option, "Automatic focus mode for caret movement". That option also has NVDA leave focus mode and go on past a field whenever a caret key can't move any further in it. JAWS leaves forms mode only when you arrow past a field of one line with Up or Down Arrow. Now, in a field of more than one line, and with Left and Right Arrow, Page Up, Page Down and Control with an arrow key in any field, the caret stays in the field, in focus mode. Up or Down Arrow in a field of one line, such as a search box, still goes on in browse mode, as in JAWS, and arrowing into a field still switches to focus mode. To have NVDA leave fields at their edges again, uncheck "Stay in an edit field on a web page when the arrow keys reach its start or end; only Up and Down Arrow leave a field of one line" in NVDA's Settings, JAWS Migration Assistant.

* NVDA says the Outlook message you move to, not the one you leave. A tester pressed End in Outlook's Inbox to go to the newest message and heard "unread From joshknnd1982, Subject Re: ...", the message the tester was leaving, which had already been read, and only then the newest message. The tester pressed Enter while NVDA was still saying the first one, and opened the newest message, not the one NVDA had just said. Down Arrow did the same when the next message was unread and the one left wasn't. When the selection moves, Outlook tells NVDA that the name of the message you left changed, and NVDA's focus is still on that message until Outlook's focus event for the new one comes, so NVDA said it again. NVDA's Outlook support takes a message's status, such as unread, from Outlook's selection, which is already the new message, so the message you left was said with the new message's status. JAWS says only the message you move to. Now, when Outlook's focus has left a message, NVDA doesn't say that message again, and says the one you moved to as before. A change of the message you are on is still said. Setting: "When you move in Outlook's message list, say only the message you come to, not the one you leave".

Version 1.21

* A JAWS dictionary for one program changes speech only in that program, as in JAWS. A tester heard "job" said wrongly on a web page. Freedom Scientific's own dictionary for the Bible program Theophilos says "Job" as "jobe", for the Book of Job, and JAWS uses it only in Theophilos. Earlier versions put the rules of every JAWS program dictionary into NVDA's default dictionary, which NVDA uses in every program, so NVDA said "jobe" everywhere, and a rule from Excel's dictionary had it say the word "a" as "eigh". Now each JAWS program dictionary is a dictionary of its own, which NVDA uses only while you are in that program, before its default dictionary. Shortly after NVDA starts, the rules an earlier migration put into NVDA's default and voice dictionaries move there, once, after a backup of NVDA's settings, and NVDA says how many. When NVDA logs at its debug level, its log also names each dictionary rule that changes what NVDA says, and the JAWS file and line it came from. There is nothing to set.
* NVDA no longer says "alert" alone when a GitHub page loads. A tester who went straight to a repository's page on GitHub heard "Skip to content", then "alert" and nothing more. As the page finishes loading, GitHub adds an alert with nothing in it. NVDA leaves out an alert only when it has nothing at all under it, and GitHub's has an empty part under it, so NVDA said the word "alert" alone. JAWS says an alert's text and nothing else, so it says nothing there. Now NVDA leaves out an alert with nothing in it: no name, description or text in it or in anything in it, and nothing in it that can take the focus. Any other alert is said as before. Setting: "Don't say "alert" for an alert with nothing in it, as on GitHub pages".
* NVDA+Shift+J, then L saves NVDA's log in Documents as a zip file small enough to attach to a GitHub issue, and puts the file's full name on the clipboard for GitHub's Open dialog. A tester's log about typing in a large document never reached the issue: GitHub attaches files of 25 MB at most and left only "Failed to upload", as it did for three more of the tester's issues that night. Zipped, a 22 MB log comes to a third of a megabyte. The zip file holds nvda.log, nvda-old.log and the assistant's debug log, so nothing needs to be typed into the log itself. The tester's letters went missing as they typed a note at the top of a saved log in Notepad. It is also in the NVDA menu: Tools, JAWS Migration Assistant, Save NVDA's log for a GitHub issue. There is nothing to set.

Version 1.20

* NVDA+F7 on a page without links says "no links", as JAWS's Insert+F7 does, and opens nothing. A tester pressed Alt+Left on a GitHub page and came to Edge's New Tab page, which has no links. NVDA+F7 opened an empty Elements List, and NVDA said only "Elements List dialog, tree view". A list you left on headings, form fields, buttons or landmarks still opens, even when the page has none, so that you can choose another kind there. Setting: "Show links in NVDA's Elements List as JAWS's Links List does...".
* Activating a link from the Elements List moves NVDA's cursor to it. The tester chose "reply-to-sender-outlook" in the list and pressed Enter, went back with Alt+Left, and NVDA+F7 opened on "Current page Repositories (48)", the link NVDA's cursor had been on before. NVDA activated the link without moving its cursor there, so going back returned to the old place. Now NVDA moves its cursor to the link first, as the list's Move to button does, then activates it, as pressing Enter on the link does. Going back with Alt+Left brings you to that link, and NVDA+F7 opens on it. In focus mode nothing changes. Same setting.
* Fixed: NVDA said the Elements List's first item up to four times when the page changed as NVDA filled the list: "Skip to content level 1, 1 of 69" three times, then "Skip to content, 1 of 69". Since 1.17 NVDA fills the list again when that happens. Windows gave the focus to each item of the first list as NVDA took it away, and NVDA said those items after the dialog appeared. Now NVDA says the list's item once. There is nothing to set.

Version 1.19

* The Elements List shows links as JAWS's Links List does. A tester compared the two on github.com: JAWS said "Homepage ( g then d ), 2 of 34", NVDA "Homepage ( g then d ); visited, 2 of 50, level 0". Now a link in NVDA's Elements List (NVDA+F7) is its text, without "visited" and "same page", with "current page" before a link the page marks as the one for the page you are on ("Current page Code"), and the link's shortcut key after its text ("joshknnd1982 Alt+ArrowUp"), as in JAWS's list. NVDA no longer says "level 0" with each item where no item is under another, as for links, buttons and form fields: it only said that the item is at the top of the list. Where headings or landmarks are under others, their levels are said as before. Setting: "Show links in NVDA's Elements List as JAWS's Links List does: current page and shortcut keys, without visited, same page or level 0".
* NVDA's log shows what happens to the keys you type. Typing at the top of NVDA's log in Windows 11's Notepad, a tester heard nothing, and letters and spaces were missing from the text itself. NVDA says a character when the program types it, so it can't say one the program never typed. When NVDA logs at its debug level, its log now says when a program types a key late, which keys it never types, and what NVDA was doing meanwhile, so that the next log shows what held the typing up. Nothing else changes.

Version 1.18

* Fixed: NVDA+F7 could reach the program. A tester pressed Alt+Left in Edge's Downloads panel, whose document stopped being ready, then NVDA+F7: NVDA had no browse mode document ready, so it gave Edge the F7, Edge's key for caret browsing, and Edge asked "Turn on caret browsing?". JAWS's Insert+F7 never reaches the program. Now a key that opens the Elements List, NVDA+F7 or one the migration gave it such as JAWS's Insert+F6, never does either. While the page is still loading, NVDA opens the list as soon as the page is ready, if that is within three seconds and you press nothing else meanwhile. Otherwise NVDA says what JAWS says: "This feature is only available from within a virtual document, such as a page on the Internet." Nothing to set.
* The Elements List shows what is still on the page. With 1.17, a list whose page took a link away at each of NVDA's three tries opened empty. Now a link the page took away is left out and the rest are listed, as in JAWS's Links List. Typing in the list's Filter box after the page changed works too, and a heading is read where it is now.
* NVDA started with Control+Alt+N comes up in the window you were in. A tester heard "Copilot pinned" when NVDA started: the focus was on the taskbar's first button, which Windows 11 names that way when Copilot is pinned there. Windows puts the focus on the taskbar whenever a desktop shortcut's key starts a program, and Control+Alt+N is the key of NVDA's desktop shortcut. JAWS, started with its own Control+Alt+J, goes back to the window that was active. Now NVDA does too, before it says where the focus is, and goes to the desktop when no window is open or all are minimized. Setting: "When NVDA starts with the focus on the taskbar, as Control+Alt+N leaves it, go back to the window you were in".

Version 1.17

* Fixed: NVDA+F7 on a web page that was still changing, such as a GitHub page just after it loaded, could leave NVDA's Elements List half made. It never appeared, but it kept the focus: Enter activated a link on the page behind it, Escape and NVDA+F7 did nothing, and only Alt+Tab got you out. NVDA finds the page's links first and reads their names after; the page changed in between, and NVDA 2026.2 stopped with an error halfway through making its dialog. Now an element that has moved is read where it is now, and NVDA fills the list again when the page changed meanwhile, so the list shows the page as it is. If the page still won't hold still after three tries, the list opens empty and NVDA says that the page changed, so Escape closes it. Nothing to set: on a page that isn't changing, the list works as before.

Version 1.16

* Fixed: with 1.15, File Explorer's "Data (D:)" could still be read with a smiley. NVDA applies its speech dictionaries before its symbols, so a dictionary entry for ":)" changes the drive's name before 1.15's rule can leave the ":)" out. Such an entry matches anywhere in the text, as the ones NVDA's dictionary dialog makes do by default, and as the migration makes for a JAWS rule made only of symbols. Now the ":)" after a drive letter is taken out before NVDA's speech dictionaries too: "Data left paren D" at Most, "Data D" at Some. At All, and when reading by character, NVDA reads it as before, and a ":)" anywhere else is read as before. Same setting: "Say a drive's name as JAWS does, without the colon and parenthesis after its letter, as in Data (D:)".

Version 1.15

* Fixed: File Explorer's "Data (D:)" was said "Data left paren D colon right paren" at NVDA's Most punctuation level, and the ":)" sounded like a smiley. JAWS says "Data (D". Now NVDA leaves out the colon and closing parenthesis after a drive letter, in This PC, the navigation pane, the address bar, Open and Save As dialogs and Alt+Tab: "Data left paren D" at Most, "Data D" at Some. At All, and when reading by character, every symbol is still said, and a ":)" anywhere else is said as before. Setting: "Say a drive's name as JAWS does, without the colon and parenthesis after its letter, as in Data (D:)".
* Fixed: NVDA froze in Windows 11's Notepad with a large file, and came back only when it was restarted. Enhanced Control Support, which the assistant offers to install, checks the control you are on 20 times a second as it comes ("Rely on events by default" unchecked), and in a document that means reading all of its text each time: with 21 million characters in Notepad, each read took a quarter of a second, and Control+Home froze NVDA until the tester restarted it. NVDA follows a document's text itself, so Enhanced Control Support now leaves its checks off documents and multi-line text fields. Its own controls, and windows you set up in it with NVDA+Alt+C, keep them. Setting: "Keep Enhanced Control Support from reading a document's whole text 20 times a second, which can freeze NVDA in a large file".

Version 1.14

* Fixed: with 1.13, Alt+Tab back to This PC still said "Data (D:), 3 of 3", where JAWS says "Data (D:)", and Alt+Tab said "This PC - File Explorer, 2 of 11" at each press, where JAWS says the window's name alone. Now Alt+Tab says only the window's name, and File Explorer leaves out the position when you switch to its window, open a folder or Tab to its list, in Open and Save As dialogs too. The arrow keys still say "2 of 3" as before, and NVDA+Tab says everything. Setting: "Don't say the position, such as 3 of 3, in Alt+Tab or when you come to a list in File Explorer".
* The help's Debug logs section says how to attach NVDA's log file itself: selecting all of a very long log in NVDA's Log Viewer can freeze NVDA. It also explains why a tester's log grew to 24 million characters in ten minutes: Emoticons 38.0.0 on NVDA 2026.2 made NVDA write 176 warnings each time it switched profiles.

Version 1.13

* Fixed: when you pressed H, NVDA said the landmark or region a heading was in before the heading, so "main landmark, Welcome to AppleVis, heading, level 1" sounded as if the heading were the main landmark. JAWS's H says the heading alone. Now quick navigation to a heading (H, Shift+H, 1 to 9, Move to in the Elements List) leaves out the landmarks, regions, lists, tables and articles around it: "Welcome to AppleVis, heading, level 1". D and the arrow keys still say landmarks. To hear them with H again, uncheck "When quick navigation moves to a heading, don't say the landmark, region or list it is in" in NVDA's Settings, JAWS Migration Assistant.
* Fixed: version 1.12 read a heading's level before its text when you pressed H. JAWS says the text first ("Feels to good to be true, visited, heading level 2"), so NVDA does again, and 1.12's check box is gone.
* Fixed: File Explorer said "Data (D:), row 2, column 1, 3 of 3", where JAWS says "Data (D:)". Drives and files, Alt+Tab's windows and Outlook's messages no longer get a row and column ("row 2610, column 1, through 13" in Outlook). NVDA+Tab still says them, and table cells keep theirs. Setting: "Leave out the row and column numbers of items in lists, such as drives, files and messages".
* Fixed: Backspace said nothing in Windows 11's Notepad with a long document. NVDA says what Backspace deletes only if it sees the caret move within a tenth of a second, and Notepad took longer. JAWS says it without waiting. Now, when NVDA gives up, the assistant watches the text for up to 0.4 seconds more and NVDA says the character (or, with Control+Backspace, the word) once it is gone. Setting: "Say what Backspace deletes, even when the program is slow to delete it".
* Fixed: after Tab from a title box on github.com, letters typed on the editor's "Write" tab went to the page, and S opened GitHub's search. NVDA stays in focus mode on tabs and toolbars, where JAWS stays in its virtual cursor. Now a tab on a web page, and a button or check box you Tab to in a toolbar, keep browse mode, so letters don't reach the page. Setting: "Stay in browse mode when you Tab to a tab or a toolbar button on a web page".
* Outlook: when something other than NVDA's main thread asks Outlook for a message's status, NVDA's log now says what asked, not just the thread's name.

Version 1.12

* Fixed: quick navigation said a heading's level last. A tester pressed H on a football news site and heard "main landmark, Texans' Nico Collins Likely To Miss Week 3, link, heading, level 2". NVDA reads whatever quick navigation moves to the way it reads a control you Tab to, text first, headings included, while the arrow keys read the same heading with its level first, as JAWS does. Now, when you move to a heading with H, Shift+H, the keys 1 to 9 or Move to in the Elements List, NVDA reads it in the order the arrow keys use: "main landmark, heading, level 2, link, Texans' Nico Collins Likely To Miss Week 3". The words are the same; only the order changes. Links, buttons, form fields and everything else quick navigation moves to keep NVDA's order, and so does Tab. To hear headings text first again, uncheck "Say a heading's level before its text when you move to it with quick navigation" in NVDA's Settings, JAWS Migration Assistant.

Version 1.11

* Fixed: opening Outlook could leave the focus in NVDA's own window. A tester pressed the Mail key in Microsoft Edge. Outlook came up, but NVDA said "NVDA window", and the focus stayed there until the tester pressed Alt+Tab. NVDA reads a message's status, such as unread, from Outlook itself, and Outlook offers it only after it has lost the focus once since it started. So the first time NVDA asks, it moves the focus for a moment to a "Waiting for Outlook..." window of its own, then lets it go back, which works only when NVDA's main thread asks. This time the question came from elsewhere in NVDA, and the focus never went back. Now only NVDA's main thread asks Outlook, and if NVDA's window still has the focus after NVDA waited for Outlook, the focus goes back to the window you were in. The first time after Outlook starts, NVDA still says "Waiting for Outlook..." for a moment, as it does without add-ons; then you are in Outlook.

Version 1.10

* Fixed: NVDA said "non breaking space" on web pages. Web pages put a no-break space between words all the time, and JAWS's symbol file for Eloquence names it "non breaking space" at the Most punctuation level, so at NVDA's Most level a tester heard it all through a football news site: "tight end non breaking space". Now JAWS's names for spaces and line breaks are said only when you read by character, as NVDA does with its own. NVDA no longer says "vertical tab" where Word and HTML e-mail break a line either. Page breaks and tabs are said as before. If you migrated with an earlier version, the assistant repairs its own symbols once, a little after NVDA starts, after backing up NVDA's settings, and tells you what it changed. Symbols you made yourself stay as they are.

Version 1.9

* Fixed: NVDA kept reading a system tray icon whose program changes it, such as a temperature monitor's icon, which changes every few seconds. A tester's NVDA started with the focus on such an icon and kept saying "CPU 129.9 F; Drive C Temperature 113.0 F; ...", with new temperatures, until the tester pressed Alt+Tab. Now NVDA says a system tray icon when you move to it, and NVDA+Tab reads it as it is now, but NVDA doesn't read it again when its program changes it. Braille still shows every change. If you press a key on the icon and the icon changes within a moment, NVDA says the change, once for each key press. This works on Windows 10 and Windows 11, for the programs' icons, the clock, the system's own icons and the hidden icons. To hear every change again, uncheck "Say a system tray icon when you move to it, not each time its program changes it" in NVDA's Settings, JAWS Migration Assistant.

Version 1.8

* Fixed: checking a radio button in browse mode could make NVDA say "checked" twice. When you press Space on a control in browse mode, NVDA says what changed as the focus moves to it, then the control reports the same change itself, and NVDA said it again: on visible.com, whose payment options rewrite their label when they are checked, you heard "As low as $49.97/mo for 36 months 0% APR + taxes, checked", then "checked". Now NVDA says it once, for radio buttons, check boxes and any other control you activate in browse mode. A later change is still said, and braille still shows every change. This is part of "Say a control's type and state once, even when its label repeats them" in NVDA's Settings, JAWS Migration Assistant, and turns off with it.
* New: "Play JAWS's layered keystroke sound for NVDA+Shift+J, instead of a beep", in NVDA's Settings, JAWS Migration Assistant. It is checked, so NVDA+Shift+J plays JAWS's sound as before. Uncheck it for a beep. The assistant keeps its copy of JAWS's sound either way, so you can check it again after JAWS is uninstalled.

Version 1.7

* The assistant always appears in NVDA's menus. With version 1.5 it was missing from the NVDA menu's Preferences and Tools, from NVDA's Settings and from Input Gestures, because 1.5 didn't start (1.6 fixed that). The assistant now adds its menu items and its Settings category first as NVDA starts, and every other part of its start runs on its own. If one ever fails, it goes to the debug log, and the Preferences item, the Tools submenu, the Settings category and NVDA+Shift+J keep working, so you can always open the assistant, restore a backup or read the debug log.
* If you still have version 1.5, install 1.7 yourself from the releases page: 1.5 never started, so it can't check for updates.

Version 1.6

* Fixed: version 1.5 didn't start in NVDA at all, so the assistant was missing from the NVDA menu and from NVDA's Input Gestures dialog, and NVDA+Shift+J did nothing. Its new layered keystroke sound used a part of Python that NVDA's own copy of Python doesn't include. Everything 1.5 added now works. If one of the assistant's own features ever can't start, the rest of the assistant still does.

Version 1.5

* Fixed: on some web pages NVDA said a control's type and state twice. Those pages write what a screen reader says into the control's label: on visible.com a payment option is labelled "As low as $49.97/mo for 36 months 0% APR + taxes, radio button checked 1 of 2", so NVDA said "radio button checked 1 of 2, radio button, checked". When NVDA says a control's type and state itself, the page's copy is now left out of the label, for radio buttons, check boxes, buttons, combo boxes, edit fields, links, tabs and other controls, in browse mode and in focus mode. NVDA's own words are the ones kept, because they are right even when a page forgets to update its copy. To turn this off, uncheck "Say a control's type and state once, even when its label repeats them" in NVDA's Settings, JAWS Migration Assistant.
* New: NVDA+Shift+J plays the sound JAWS plays when a layered keystroke such as Insert+Space starts (KeyLayerSound.wav, or the sound you chose for it in JAWS) instead of a beep. The assistant keeps a copy, so the sound stays after JAWS is uninstalled. Without a JAWS sound, NVDA+Shift+J beeps as before.

Version 1.4

* No sound when NVDA exits after a migration, as with JAWS: Screen Curtain's off sound is left out while NVDA exits.
* On JAWS's Laptop layout, Insert keystrokes with a command of their own run it: Insert+J opens the NVDA menu, and Insert+H and Insert+8 open NVDA's Input Gestures dialog.
* Times such as 6:02 PM are read as times, with JAWS's rule for a colon between digits.
* Eloquence speaks at your JAWS speed.
* Restoring a backup lists the changes you will notice, such as NVDA saying "clickable" again."""
