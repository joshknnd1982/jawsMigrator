name = jawsMigrator
summary = "JAWS Migration Assistant"
description = """Brings a JAWS user's settings into NVDA: Settings Center options, voice profiles and voice aliases, speech and sound schemes, dictionaries, punctuation, keystrokes and sounds, mapped to their NVDA equivalents. Adapts to each computer's JAWS versions, languages, synthesizers and add-ons, backs up NVDA's settings first, and never changes JAWS."""
author = "Josh Kennedy (https://github.com/joshknnd1982)"
url = https://github.com/joshknnd1982/jawsMigrator
version = 1.0
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
changelog = """First release.

* Detects every JAWS version, its languages and settings folders, Windows and NVDA, and says so plainly when JAWS is not installed.
* Migrates Settings Center, voice profiles, dictionaries, punctuation, Keyboard Manager and Navigation Quick Keys, sounds, and settings for single applications, into a separate NVDA profile or NVDA's normal configuration.
* With ClassicSpeech installed, copies every JAWS voice profile, voice alias (including Rent-A-Crowd) and speech and sound scheme into ClassicSpeech.
* Offers to install Enhanced Control Support, Custom Labels, Custom Browse Mode and Custom Notifications from the Add-on Store.
* Backs up NVDA's settings before every migration and can restore them; never changes or uninstalls JAWS.
* NVDA+Shift+J command layer, including a JAWS keystroke helper, and automatic updates from GitHub."""
