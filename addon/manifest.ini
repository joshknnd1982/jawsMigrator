name = jawsMigrator
summary = "JAWS Migration Assistant"
description = """Brings a JAWS user's settings into NVDA: Settings Center options, voice profiles and voice aliases, speech and sound schemes, dictionaries, punctuation, keystrokes for each keyboard layout, and JAWS sounds, mapped to their NVDA equivalents. You choose exactly what comes over. With ClassicSpeech, JAWS sounds can play in place of NVDA's own and are all copied into ClassicSpeech. Adapts to each computer's JAWS versions, languages, synthesizers and add-ons, backs up NVDA's settings, add-ons and add-on settings first, and never changes JAWS."""
author = "Josh Kennedy (https://github.com/joshknnd1982)"
url = https://github.com/joshknnd1982/jawsMigrator
version = 1.2
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
changelog = """Version 1.2

* New: copy every JAWS sound into ClassicSpeech, as the scheme JAWS Sounds (from JAWS) in ClassicSpeech's Schemes folder, converted where needed so NVDA can play them. NVDA+Shift+J then A, the Tools menu, NVDA's Settings, or the migration's Sound effects step.
* New: JAWS sounds in place of NVDA's own, through ClassicSpeech. Switching between focus and browse mode, spelling errors, auto-suggestions, the screen curtain, Remote Access and logged errors sound as in JAWS, in every ClassicSpeech scheme. NVDA+Shift+J then S switches between JAWS sounds and NVDA's own; the Tools menu and NVDA's Settings have Use JAWS sounds and Restore NVDA's own sounds.
* NVDA's own sound files are never changed. Before JAWS sounds go in, NVDA's settings, add-ons and add-on settings are backed up and NVDA's own sounds are copied. Restoring NVDA's sounds takes out exactly what was added and leaves your own ClassicSpeech changes.
* JAWS sounds need ClassicSpeech; without it the assistant says so and changes nothing. Version 1.1's own way of playing JAWS sounds is turned off; if you used it, press NVDA+Shift+J then S to use JAWS sounds again."""
