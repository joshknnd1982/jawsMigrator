name = jawsMigrator
summary = "JAWS Migration Assistant"
description = """Brings a JAWS user's settings into NVDA: Settings Center options, voice profiles and voice aliases, speech and sound schemes, dictionaries, punctuation, keystrokes for each keyboard layout, and sounds, mapped to their NVDA equivalents. You choose exactly what comes over. Adapts to each computer's JAWS versions, languages, synthesizers and add-ons, backs up NVDA's settings, add-ons and add-on settings first, and never changes JAWS."""
author = "Josh Kennedy (https://github.com/joshknnd1982)"
url = https://github.com/joshknnd1982/jawsMigrator
version = 1.1
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
changelog = """Version 1.1

* New: NVDA menu, Preferences, JAWS Migration Assistant settings. Choose exactly which JAWS settings, speech and sound schemes, voice profiles, voice aliases, keyboard layouts and other items to import, with Select all and Select none buttons, a Check for updates button and a button that opens NVDA's Input Gestures dialog. The choice is saved and used by every migration.
* New: JAWS keystrokes by keyboard layout. Desktop, Laptop, Classic Laptop, Kinesis and any other layout in the JAWS key map can each be brought over, as gestures of the matching NVDA keyboard layout. Choose NVDA's keyboard layout too; Caps Lock becomes an NVDA key with the Laptop layout.
* Backups now hold NVDA's whole settings folder: every add-on, the add-ons' own settings and data, and which add-ons are enabled. Restoring a backup puts add-ons back the way NVDA installs and removes them, removing add-ons installed since and reinstalling ones removed or updated. Later backups share unchanged files, and the backup from before the first migration is kept for good.
* Select all and Select none buttons on every checklist of the migration wizard.
* NVDA+Shift+J then O opens JAWS Migration Assistant settings; NVDA+Shift+J then G opens NVDA's Input Gestures dialog.
* Fixed: the NVDA menu, Tools, JAWS Migration Assistant submenu and the JAWS Migration Assistant category of NVDA's Settings could be missing in 1.0, because of a name clash inside the add-on.
* The assistant says so when it is already open, instead of doing nothing."""
