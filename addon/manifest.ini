name = jawsMigrator
summary = "JAWS Migration Assistant"
description = """Brings a JAWS user's settings into NVDA: Settings Center options, voice profiles and voice aliases, speech and sound schemes, dictionaries, punctuation, keystrokes for each keyboard layout, and JAWS sounds, mapped strictly to their NVDA equivalents, so NVDA announces what JAWS announced. You choose exactly what comes over. With ClassicSpeech, which it can install for you, JAWS sounds can play in place of NVDA's own. Always installs the newest versions of the add-ons it uses. Adapts to each computer's JAWS versions, languages, synthesizers and add-ons, backs up NVDA's settings, add-ons and add-on settings first, and never changes JAWS."""
author = "Josh Kennedy (https://github.com/joshknnd1982)"
url = https://github.com/joshknnd1982/jawsMigrator
version = 1.11
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
changelog = """Version 1.11

* Fixed: opening Outlook could leave the focus in NVDA's own window. A tester pressed the Mail key in Microsoft Edge. Outlook came up, but NVDA said "NVDA window", and the focus stayed there until the tester pressed Alt+Tab. NVDA reads a message's status, such as unread, from Outlook itself, and Outlook offers it only after it has lost the focus once since it started. So the first time NVDA asks, it moves the focus for a moment to a "Waiting for Outlook..." window of its own, then lets it go back, which works only when NVDA's main thread asks. This time the question came from elsewhere in NVDA, and the focus never went back. Now only NVDA's main thread asks Outlook, and if NVDA's window still has the focus after NVDA waited for Outlook, the focus goes back to the window you were in. The first time after Outlook starts, NVDA still says "Waiting for Outlook..." for a moment, as it does without add-ons; then you are in Outlook.

Version 1.10

* Fixed: NVDA said "non breaking space" on web pages. Web pages put a no-break space between words all the time, and JAWS's symbol file for Eloquence names it "non breaking space" at the Most punctuation level, so at NVDA's Most level a tester heard it all through a football news site: "tight end non breaking space". Now JAWS's names for spaces and line breaks are said only when you read by character, as NVDA does with its own. NVDA no longer says "vertical tab" where Word and HTML e-mail break a line either. Page breaks and tabs are said as before. If you migrated with an earlier version, the assistant repairs its own symbols once, a little after NVDA starts, after backing up NVDA's settings, and tells you what it changed. Symbols you made yourself stay as they are.

Version 1.9

* Fixed: NVDA kept reading a system tray icon whose program changes it, such as a temperature monitor's icon, which changes every few seconds. A tester's NVDA started with the focus on such an icon and kept saying "CPU 129.9 F; Drive C Temperature 113.0 F; ...", with new temperatures, until the tester pressed Alt+Tab. Now NVDA says a system tray icon when you move to it, and NVDA+Tab reads it as it is now, but NVDA doesn't read it again when its program changes it. Braille still shows every change. If you press a key on the icon and the icon changes within a moment, NVDA says the change, once for each key press. This works on Windows 10 and Windows 11, for the programs' icons, the clock, the system's own icons and the hidden icons. To hear every change again, uncheck "Say a system tray icon when you move to it, not each time its program changes it" in NVDA's Settings, JAWS Migration Assistant.

Version 1.8

* Fixed: checking a radio button in browse mode could make NVDA say "checked" twice. When you press Space on a control in browse mode, NVDA says what changed as the focus moves to it, then the control reports the same change itself, and NVDA said it again: on visible.com, whose payment options rewrite their label when they are checked, you heard "As low as $49.97/mo for 36 months 0% APR + taxes, checked", then "checked". Now NVDA says it once, for radio buttons, check boxes and any other control you activate in browse mode. A later change is still said, and braille still shows every change. This is part of "Say a control's type and state once, even when its label repeats them" in NVDA's Settings, JAWS Migration Assistant, and turns off with it.
* New: "Play JAWS's layered keystroke sound for NVDA+Shift+J, instead of a beep", in NVDA's Settings, JAWS Migration Assistant. It is checked, so NVDA+Shift+J plays JAWS's sound as before. Uncheck it for a beep. The assistant keeps its copy of JAWS's sound either way, so you can check it again after JAWS is uninstalled.

Version 1.7

* The assistant always appears in NVDA's menus. With version 1.5 it was missing from the NVDA menu's Preferences and Tools, from NVDA's Settings and from Input Gestures, because 1.5 didn't start (1.6 fixed that). The assistant now adds its menu items and its Settings category first as NVDA starts, and every other part of its start runs on its own. If one ever fails, it goes to the debug log, and the Preferences item, the Tools submenu, the Settings category and NVDA+Shift+J keep working, so you can always open the assistant, restore a backup or read the debug log.
* If you still have version 1.5, install 1.7 yourself from the releases page: 1.5 never started, so it can't check for updates.

Version 1.6

* Fixed: version 1.5 didn't start in NVDA at all, so the assistant was missing from the NVDA menu and from NVDA's Input Gestures dialog, and NVDA+Shift+J did nothing. Its new layered keystroke sound used a part of Python that NVDA's own copy of Python doesn't include. Everything 1.5 added now works. If one of the assistant's own features ever can't start, the rest of the assistant still does.

Version 1.5

* Fixed: on some web pages NVDA said a control's type and state twice. Those pages write what a screen reader says into the control's label: on visible.com a payment option is labelled "As low as $49.97/mo for 36 months 0% APR + taxes, radio button checked 1 of 2", so NVDA said "radio button checked 1 of 2, radio button, checked". When NVDA says a control's type and state itself, the page's copy is now left out of the label, for radio buttons, check boxes, buttons, combo boxes, edit fields, links, tabs and other controls, in browse mode and in focus mode. NVDA's own words are the ones kept, because they are right even when a page forgets to update its copy. To turn this off, uncheck "Say a control's type and state once, even when its label repeats them" in NVDA's Settings, JAWS Migration Assistant.
* New: NVDA+Shift+J plays the sound JAWS plays when a layered keystroke such as Insert+Space starts (KeyLayerSound.wav, or the sound you chose for it in JAWS) instead of a beep. The assistant keeps a copy, so the sound stays after JAWS is uninstalled. Without a JAWS sound, NVDA+Shift+J beeps as before.

Version 1.4

* No sound when NVDA exits after a migration, as with JAWS: Screen Curtain's off sound is left out while NVDA exits.
* On JAWS's Laptop layout, Insert keystrokes with a command of their own run it: Insert+J opens the NVDA menu, and Insert+H and Insert+8 open NVDA's Input Gestures dialog.
* Times such as 6:02 PM are read as times, with JAWS's rule for a colon between digits.
* Eloquence speaks at your JAWS speed.
* Restoring a backup lists the changes you will notice, such as NVDA saying "clickable" again."""
