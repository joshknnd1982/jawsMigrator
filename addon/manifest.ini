name = jawsMigrator
summary = "JAWS Migration Assistant"
description = """Brings a JAWS user's settings into NVDA: Settings Center options, voice profiles and voice aliases, speech and sound schemes, dictionaries, punctuation, keystrokes for each keyboard layout, and JAWS sounds, mapped strictly to their NVDA equivalents, so NVDA announces what JAWS announced. You choose exactly what comes over. With ClassicSpeech, which it can install for you, JAWS sounds can play in place of NVDA's own. Always installs the newest versions of the add-ons it uses. Adapts to each computer's JAWS versions, languages, synthesizers and add-ons, backs up NVDA's settings, add-ons and add-on settings first, and never changes JAWS."""
author = "Josh Kennedy (https://github.com/joshknnd1982)"
url = https://github.com/joshknnd1982/jawsMigrator
version = 1.3
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
changelog = """Version 1.3

* Fixed: NVDA said "clickable" on web pages where JAWS doesn't, and speech sped up, slowed down or changed pitch as you moved between programs. Version 1.2 put your JAWS settings in a separate NVDA profile, which other add-ons such as Custom Browse Mode switch off. JAWS settings now go into NVDA's normal configuration by default, after a backup. Migrate again to move them there; the old profile then stops turning on at startup, and empty profiles from 1.2 are removed.
* Fixed: after a migration the speech rate jumped back to 100% when you left the rate slider. Rate, pitch and volume come from the percentage JAWS shows (Eloquence rate 95 is 64%), are set once in NVDA's voice settings, and are never stored in ClassicSpeech, so you control them. ClassicSpeech voices carry only the person. A one-time repair, after a backup, fixes the voices versions 1.0 to 1.2 wrote.
* Stricter mapping: NVDA announces what JAWS announces, and nothing more. Browse mode follows JAWS's web verbosity level ("clickable" only at High), fonts, colors and attributes follow the JAWS scheme you use, and a voice JAWS uses only for an announcement no longer reads the text. NVDA's start and exit sounds are turned off, as JAWS plays none.
* You choose which ClassicSpeech scheme is turned on, on every migration; unless you choose one, ClassicSpeech stays as it is. ClassicSpeech Voice Profiles for the JAWS cursor and messages are your choice too.
* New: when ClassicSpeech is missing, a dialog offers to install it. The assistant always installs the newest versions of the add-ons it uses (ClassicSpeech from GitHub, the others from the Add-on Store), checked against their SHA-256, and updates older copies. Install or update ClassicSpeech at any time from the Tools menu, or with NVDA+Shift+J then C.
* New: Control Usage Assistant, for people new to computers, is among the recommended add-ons.
* New: detailed debug logs, one per migration and one for everything else (Tools menu, Open the debug log).
* Fixed: dictionary rules such as "St." or "AN:" changed the middle of other words ("Plan:" was read "Placcount number"), and JAWS character codes such as \150 were not understood. A one-time repair fixes the rules earlier versions wrote.
* Fixed keystrokes: on the Laptop layout, Caps Lock+Y and Caps Lock+N typed a letter and turned Caps Lock on, and Caps Lock+J and Caps Lock+H opened NVDA's menu and Input Gestures. JAWS keystrokes no longer take NVDA commands such as NVDA+Control+R without asking. A one-time repair removes the harmful keystrokes earlier versions added.
* Fixed: NVDA read many wizard controls with the wrong names, and some access keys pressed the wrong button.
* Fixed: restoring a backup finished add-on removals while the add-ons were running; ClassicSpeech's settings could be lost when it wasn't running; voice dictionary rules went into the wrong voice; sleep mode couldn't be turned off in some programs; and your own profile triggers could be taken over."""
